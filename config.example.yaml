# AI OffScreen 配置示例
# 复制为 config.yaml 后按需修改。密钥只写环境变量名，绝不写密钥本身。
# 接口细节见 docs/PROVIDERS.md；架构约束见 docs/ARCHITECTURE.md §8。

data_dir: ./data
media_roots:            # 只允许从这些目录导入电影
  - ~/Movies

providers:
  minimax:              # Token Plan 订阅 Key：文本 + 图片理解 + 语音合成
    kind: openai_compat
    base_url: https://api.minimaxi.com/v1
    api_key_env: MINIMAX_API_KEY
    max_concurrency: 2  # 订阅套餐有 RPM/TPM 限流和 5 小时 / 周额度窗口
    json_mode: prompt   # 无原生 JSON Schema 约束 → JSON 降级模式
    extra_body:         # 并入每个请求（docs/PROVIDERS.md §2.3）
      reasoning_split: true            # 思考内容放进 reasoning_content，content 保持干净
      thinking: { type: disabled }     # MiniMax-M3 可关；M2.x 忽略；M3.1-Flash 不能关，换用时删掉这行

  deepseek:             # 按量付费
    kind: openai_compat
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    max_concurrency: 4
    json_mode: prompt

  ark:                  # 火山方舟：只能填「按量付费」Key，不能用 Coding Plan Key（会被拒绝）
    kind: openai_compat
    base_url: https://ark.cn-beijing.volces.com/api/v3
    api_key_env: ARK_PAYG_API_KEY
    max_concurrency: 4
    enabled: false

  volc_speech:          # 火山豆包语音（M6-04 接入）
    kind: volc_tts
    api_key_env: VOLC_SPEECH_API_KEY
    enabled: false

tasks:                  # 每个 LLM 任务单独选供应商和模型
  scene_segment:   { provider: minimax,  model: MiniMax-M3 }
  story:           { provider: minimax,  model: MiniMax-M3 }
  character_name:  { provider: minimax,  model: MiniMax-M3 }
  shot_caption:    { provider: minimax,  model: MiniMax-M3, shots_per_request: 8 }
  script_outline:  { provider: minimax,  model: MiniMax-M3 }
  script_write:    { provider: minimax,  model: MiniMax-M3 }
  script_rewrite:  { provider: minimax,  model: MiniMax-M3 }
  script_critic:   { provider: deepseek, model: deepseek-v4-pro }
  match_rerank:    { provider: minimax,  model: MiniMax-M3 }

asr:
  provider: faster_whisper   # 本地免费；云端可选 minimax（asr-1.0，单次 ≤ 500 秒）
  model: large-v3
  device: cuda

faces:
  provider: insightface   # 本地；需要 insightface 与 onnxruntime（首次使用下载 buffalo_l 模型，约 280 MB）
  model: buffalo_l
  device: cpu             # 关键帧上检测，CPU 够用；有 GPU 可改 cuda（装 onnxruntime-gpu）

embeddings:             # 按画面描述搜镜头（search_shots）；任一项设为 null 即关闭那一路
  provider: sentence_transformers   # 本地；需要 sentence-transformers（含 torch），首次使用下载模型
  image_model: clip-ViT-B-32                     # 关键帧 -> 向量
  image_text_model: clip-ViT-B-32-multilingual-v1 # 查询 -> 同一个空间（支持中文）
  caption_model: BAAI/bge-m3                     # 镜头描述 / 查询 -> 文本向量
  device: cpu

tts:
  provider: minimax
  model: speech-2.8-hd
  default_voice: male-qn-qingse
  sample_rate: 32000
  # 备选：edge_tts（免费）、volc_speech、cosyvoice（侧车，音色克隆）

budget:
  confirm_above_tokens: 2000000   # 单个作业预估 token 超过此值需确认

worker:                         # 作业 Worker（gpu 通道恒为 1 个并发）
  cpu_concurrency: 2
  api_concurrency: 4
  heartbeat_timeout_s: 30       # 运行中的作业超过这么久没有心跳 → 视为 Worker 已崩溃，重新排队
