[project]
name = "offscreen"
version = "0.1.0"
description = "Personal AI movie commentary platform"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "jinja2>=3.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "scenedetect>=0.6.5",
  "sqlmodel>=0.0.47",
  "typer>=0.12",
]

[project.optional-dependencies]
gpu = []  # filled in by later milestones (faster-whisper, insightface, demucs, ...)

[project.scripts]
offscreen = "offscreen.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "import-linter>=2.0",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offscreen"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012", "RUF001", "RUF002", "RUF003"]  # pydantic copies defaults; CJK punctuation is intended

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["offscreen"]
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["offscreen.domain.*", "offscreen.algo.*"]
strict = true

[[tool.mypy.overrides]]
module = ["scenedetect", "scenedetect.*", "faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true  # no type information / not installed by default

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not heavy'"
markers = ["heavy: calls real models/APIs or needs GPU; skipped by default"]

[tool.importlinter]
root_package = "offscreen"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "R-layers: dependency direction"
type = "layers"
layers = [
  "offscreen.cli | offscreen.api | offscreen.worker",
  "offscreen.services",
  "offscreen.stages",
  "offscreen.engine",
  "offscreen.store",
  "offscreen.domain",
]

[[tool.importlinter.contracts]]
name = "R1: domain is pure (no internal modules, no infra libs)"
type = "forbidden"
source_modules = ["offscreen.domain"]
forbidden_modules = [
  "offscreen.algo", "offscreen.engine", "offscreen.stages", "offscreen.providers",
  "offscreen.media", "offscreen.store", "offscreen.services", "offscreen.worker",
  "offscreen.api", "offscreen.cli",
  "fastapi", "sqlmodel", "sqlalchemy", "anthropic", "openai",
]

[[tool.importlinter.contracts]]
name = "R2: algo depends only on domain"
type = "forbidden"
source_modules = ["offscreen.algo"]
forbidden_modules = [
  "offscreen.engine", "offscreen.stages", "offscreen.providers", "offscreen.media",
  "offscreen.store", "offscreen.services", "offscreen.worker", "offscreen.api",
  "offscreen.cli",
]

[[tool.importlinter.contracts]]
name = "R3: stages use provider ports, never adapters"
type = "forbidden"
source_modules = ["offscreen.stages"]
forbidden_modules = ["offscreen.providers.adapters"]

[[tool.importlinter.contracts]]
name = "R4: vendor SDKs only in providers.adapters"
type = "forbidden"
source_modules = [
  "offscreen.domain", "offscreen.algo", "offscreen.engine", "offscreen.stages",
  "offscreen.media", "offscreen.store", "offscreen.services", "offscreen.worker",
  "offscreen.api", "offscreen.cli",
]
forbidden_modules = [
  "anthropic", "openai", "faster_whisper", "insightface", "edge_tts", "demucs",
  "scenedetect", "lancedb",
]
allow_indirect_imports = true  # importing an adapter (services wiring) is fine; the SDK itself is not

[[tool.importlinter.contracts]]
name = "R6: api/cli/worker go through services"
type = "forbidden"
source_modules = ["offscreen.api", "offscreen.cli"]
forbidden_modules = ["offscreen.stages", "offscreen.store", "offscreen.engine"]
allow_indirect_imports = true  # R6 forbids *direct* use; going through services is the point
