id: suspense
name: 悬疑紧凑
description: 节奏快、信息一点点放出，适合悬疑、犯罪、惊悚和高概念科幻
tone: 克制、冷静、略带压迫感；短句为主，多用设问和停顿，把信息留到最后一刻才给
perspective: third
structure:
  - name: hook
    purpose: 抛出最反常的一幕或一个没有答案的问题，让人想知道后面发生了什么
    share: 0.10
  - name: setup
    purpose: 交代主角是谁、处境如何、哪里不对劲，只给理解后面所必需的信息
    share: 0.20
  - name: development
    purpose: 事态一步步升级，每一段都留下一个新的疑点或更大的代价
    share: 0.40
  - name: climax
    purpose: 真相或冲突在这里爆发，用最短的句子讲最关键的转折
    share: 0.20
  - name: ending
    purpose: 落到结局和它留下的余味，不要总结全片
    share: 0.10
hook_types:
  - 以一个悬而未决的问题开场（"他为什么会出现在这里？"）
  - 从事情已经出错的那一刻讲起，再倒回去交代原因
  - 先说一个看似不可能的事实，再说它的代价
phrases:
  - 谁也没想到，……
  - 直到这一刻，他才发现……
  - 但事情，远没有这么简单。
  - 就在这时，……
  - 真正可怕的是，……
banned_words:
  - 这部电影讲述了
  - 让我们一起
  - 不得不说
  - 精彩绝伦
  - 值得一看
